<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel del Quincho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Panel: barra superior con resumen, pestañas y una tabla de reservas con acciones por fila */
:root {
  --bg: #eef0ea; --surface: #f9faf6; --ink: #1d2a24; --muted: #5b6a61; --line: #cfd6cc;
  --water: #0d7a83; --water-ink: #fff; --jarilla: #b9852a;
  --s-pend: #b9852a; --s-sena: #0d7a83; --s-pago: #2f7d4a; --s-canc: #8a8f8b; --danger: #b23b2e;
  --font-display: "Bricolage Grotesque", system-ui, sans-serif; --font-body: "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141c18; --surface: #1c2621; --ink: #e6ece6; --muted: #a2b1a7; --line: #33423a;
    --water: #3fb3bb; --water-ink: #0b1a1c; --jarilla: #e0b155; --s-pend: #e0b155; --s-sena: #3fb3bb; --s-pago: #6cc28a; --s-canc: #7d857f; --danger: #e5776a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.1; }
h1 { font-size: 28px; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; background: var(--water); color: var(--water-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
.btn:disabled { opacity: .5; cursor: wait; }
:focus-visible { outline: 3px solid var(--jarilla); outline-offset: 2px; }
input, select, textarea { padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.login { max-width: 360px; margin: 12vh auto 0; display: grid; gap: 12px; background: var(--surface); padding: 28px; border-radius: 14px; border: 1px solid var(--line); }
.err { color: var(--danger); min-height: 1.2em; font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--water); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 900px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
td small { color: var(--muted); display: block; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
.pill.pendiente { background: var(--s-pend); } .pill.senado { background: var(--s-sena); } .pill.pagado { background: var(--s-pago); } .pill.cancelado { background: var(--s-canc); }
.pill.vencida { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { min-width: 150px; font-weight: 600; font-size: 14px; }
.row input { flex: 1; min-width: 0; }
.list { display: grid; gap: 6px; }
.list div { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login">
    <h1>Panel del Quincho</h1>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn">Entrar</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>

  <div id="app" hidden style="display:grid;gap:20px">
    <div class="top"><h1>Panel del Quincho</h1><div class="row"><button class="btn ghost" id="refresh">Actualizar</button><button class="btn ghost" id="logout">Salir</button></div></div>
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" id="tabs">
      <button data-tab="reservas" class="on">Reservas y leads</button>
      <button data-tab="bloqueos">Bloquear fechas</button>
      <button data-tab="ajustes">Precios y datos</button>
    </nav>

    <section id="t-reservas" style="display:grid;gap:12px">
      <div class="filters">
        <select id="fEstado" aria-label="Filtrar por estado">
          <option value="activas">Próximas activas</option><option value="pendiente">Pendientes</option><option value="senado">Señadas</option>
          <option value="pagado">Pagadas</option><option value="cancelado">Canceladas</option><option value="todas">Todas</option>
        </select>
        <input id="fBuscar" placeholder="Buscar nombre, teléfono, email o ID" aria-label="Buscar">
        <button class="btn ghost" id="csv">Descargar CSV</button>
      </div>
      <div class="table-box"><table><thead><tr><th>Evento</th><th>Cliente</th><th>Contacto</th><th>Montos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </section>

    <section id="t-bloqueos" hidden>
      <div class="grid2">
        <form class="card" id="fBloq">
          <h2>Bloquear un día</h2>
          <p style="margin:0;color:var(--muted)">Para reservas que te llegan por WhatsApp o días que no alquilás. El día completo aparece ocupado en la web.</p>
          <div class="row"><label for="bFecha">Fecha</label><input id="bFecha" type="date" required></div>
          <div class="row"><label for="bMotivo">Motivo</label><input id="bMotivo" placeholder="Ej: reserva por WhatsApp de Juan"></div>
          <button class="btn">Bloquear</button>
        </form>
        <div class="card"><h2>Días bloqueados</h2><div class="list" id="bloqList"></div></div>
      </div>
    </section>

    <section id="t-ajustes" hidden>
      <div class="grid2">
        <div class="card"><h2>Precios por turno</h2><div id="precios" style="display:grid;gap:8px"></div></div>
        <div class="card"><h2>Datos de la página</h2><div id="ajustes" style="display:grid;gap:8px"></div></div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const peso = (n) => "$" + Math.round(Number(n)).toLocaleString("es-AR");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fecha = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const ETIQUETA = { pendiente: "Pendiente", senado: "Señada", pagado: "Pagada", cancelado: "Cancelada" };
const NOMBRES_AJUSTES = { sena_porcentaje: "Seña (%)", cotizacion_usd: "Cotización USD ($)", horas_pendiente: "Horas para pagar la seña", whatsapp: "WhatsApp (549...)", email_contacto: "Email de contacto", pago_usd: "Datos cuenta USD", usdt_red: "Red USDT", usdt_wallet: "Wallet USDT" };
let PASS = "";
try { PASS = sessionStorage.getItem("qpass") || ""; } catch (e) {}
let D = { reservas: [], bloqueos: [], turnos: [], ajustes: {} };

async function api(body) {
  const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": PASS }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { salir(); throw new Error(j.error || "Contraseña incorrecta."); }
  if (!r.ok) throw new Error(j.error || "Algo falló. Probá de nuevo.");
  return j;
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function salir() { PASS = ""; try { sessionStorage.removeItem("qpass"); } catch (e) {} $("#app").hidden = true; $("#login").hidden = false; }

$("#login").onsubmit = async (e) => {
  e.preventDefault(); PASS = $("#pass").value;
  try { await cargar(); try { sessionStorage.setItem("qpass", PASS); } catch (e) {} }
  catch (err) { $("#loginErr").textContent = err.message; }
};
$("#logout").onclick = salir;
$("#refresh").onclick = () => cargar().then(() => toast("Actualizado"));
$("#tabs").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["reservas", "bloqueos", "ajustes"].forEach(t => $("#t-" + t).hidden = t !== b.dataset.tab);
};

async function cargar() {
  D = await api({ accion: "listar" });
  $("#login").hidden = true; $("#app").hidden = false;
  pintar();
}
const hoy = () => new Date().toISOString().slice(0, 10);
function vencida(r) { return r.estado === "pendiente" && (Date.now() - new Date(r.created_at)) > Number(D.ajustes.horas_pendiente || 48) * 3600e3; }
const nombreTurno = (id) => (D.turnos.find(t => t.id === id) || {}).nombre || id;

function pintar() {
  const futuras = D.reservas.filter(r => r.fecha >= hoy() && r.estado !== "cancelado" && !vencida(r));
  const mes = new Date().toISOString().slice(0, 7);
  const cobradoMes = D.reservas.filter(r => (r.estado === "senado" || r.estado === "pagado") && r.fecha.startsWith(mes)).reduce((a, r) => a + Number(r.estado === "pagado" ? r.total : r.sena), 0);
  $("#kpis").innerHTML = [
    ["Próximos eventos", futuras.filter(r => r.estado !== "pendiente").length],
    ["Pendientes de seña", futuras.filter(r => r.estado === "pendiente").length],
    ["Leads totales", new Set(D.reservas.map(r => r.email)).size],
    ["Cobrado este mes", peso(cobradoMes)]
  ].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
  pintarTabla(); pintarBloqueos(); pintarAjustes();
}

function filtradas() {
  const f = $("#fEstado").value, q = $("#fBuscar").value.trim().toLowerCase();
  return D.reservas.filter(r => {
    if (f === "activas" && !(r.fecha >= hoy() && r.estado !== "cancelado")) return false;
    if (!["activas", "todas"].includes(f) && r.estado !== f) return false;
    if (q && ![r.id, r.nombre, r.apellido, r.email, r.telefono].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => f === "activas" ? a.fecha.localeCompare(b.fecha) : 0);
}
function pintarTabla() {
  const rows = filtradas();
  $("#tbody").innerHTML = rows.length ? rows.map(r => {
    const v = vencida(r);
    const tel = String(r.telefono).replace(/\D/g, "");
    let acc = "";
    if (r.estado === "pendiente") acc += `<button class="btn small" data-a="confirmar" data-f="usd" data-id="${r.id}">Seña USD</button><button class="btn small" data-a="confirmar" data-f="usdt" data-id="${r.id}">Seña USDT</button><button class="btn small ghost" data-a="confirmar" data-f="transferencia" data-id="${r.id}">Seña transf.</button>`;
    if (r.estado === "senado") acc += `<button class="btn small" data-a="pagado" data-id="${r.id}">Saldo cobrado</button>`;
    if (r.estado !== "cancelado") acc += `<button class="btn small danger" data-a="cancelar" data-id="${r.id}">Cancelar</button>`;
    return `<tr>
      <td><b>${fecha(r.fecha)}</b><small>${esc(nombreTurno(r.turno))} · ${esc(r.personas || "?")} pers.</small><small>${esc(r.id)}</small></td>
      <td>${esc(r.nombre)} ${esc(r.apellido)}<small>${esc(r.comentario || "")}</small></td>
      <td><a href="https://wa.me/${tel.startsWith("54") ? tel : "549" + tel}" target="_blank" rel="noopener">${esc(r.telefono)}</a><small>${esc(r.email)}</small></td>
      <td>${peso(r.total)}<small>Seña ${peso(r.sena)}</small></td>
      <td><span class="pill ${r.estado}">${ETIQUETA[r.estado]}</span>${v ? ` <span class="pill vencida">Vencida</span>` : ""}<small>${esc(r.forma_pago || "")}</small></td>
      <td><div class="actions">${acc}</div></td></tr>`;
  }).join("") : `<tr><td colspan="6" style="color:var(--muted);padding:24px">No hay reservas con este filtro. Las que lleguen desde la web van a aparecer acá.</td></tr>`;
}
$("#fEstado").onchange = pintarTabla;
$("#fBuscar").oninput = pintarTabla;
$("#tbody").onclick = async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  if (b.dataset.a === "cancelar" && b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro? Tocá de nuevo"; return; }
  b.disabled = true;
  try {
    await api({ accion: b.dataset.a, id: b.dataset.id, forma: b.dataset.f });
    toast(b.dataset.a === "confirmar" ? "Seña confirmada y email enviado" : b.dataset.a === "cancelar" ? "Reserva cancelada" : "Marcada como pagada");
    await cargar();
  } catch (err) { toast(err.message); b.disabled = false; }
};
$("#csv").onclick = () => {
  const cols = ["id", "created_at", "fecha", "turno", "nombre", "apellido", "nacimiento", "telefono", "email", "personas", "comentario", "total", "sena", "forma_pago", "estado", "origen"];
  const csv = [cols.join(";"), ...filtradas().map(r => cols.map(c => `"${String(r[c] ?? "").replace(/"/g, '""')}"`).join(";"))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `reservas-${hoy()}.csv`; a.click();
};

function pintarBloqueos() {
  $("#bloqList").innerHTML = D.bloqueos.length ? D.bloqueos.map(b => `<div><span><b>${fecha(b.fecha)}</b> ${esc(b.motivo || "")}</span><button class="btn small ghost" data-desb="${b.fecha}">Quitar</button></div>`).join("") : `<p style="margin:0;color:var(--muted)">No hay días bloqueados.</p>`;
}
$("#fBloq").onsubmit = async (e) => {
  e.preventDefault();
  try { await api({ accion: "bloquear", fecha: $("#bFecha").value, motivo: $("#bMotivo").value }); e.target.reset(); toast("Día bloqueado"); await cargar(); }
  catch (err) { toast(err.message); }
};
$("#bloqList").onclick = async (e) => {
  const b = e.target.closest("[data-desb]"); if (!b) return;
  try { await api({ accion: "desbloquear", fecha: b.dataset.desb }); toast("Día liberado"); await cargar(); } catch (err) { toast(err.message); }
};

function pintarAjustes() {
  $("#precios").innerHTML = D.turnos.map(t => `<div class="row"><label for="p-${t.id}">${esc(t.nombre)}<small style="display:block;font-weight:400;color:var(--muted)">${esc(t.horario)}</small></label><input id="p-${t.id}" type="number" min="0" step="1000" value="${Number(t.precio)}"><button class="btn small" data-precio="${t.id}">Guardar</button></div>`).join("");
  $("#ajustes").innerHTML = Object.keys(NOMBRES_AJUSTES).map(k => `<div class="row"><label for="a-${k}">${NOMBRES_AJUSTES[k]}</label><input id="a-${k}" value="${esc(D.ajustes[k] || "")}"><button class="btn small" data-ajuste="${k}">Guardar</button></div>`).join("");
}
$("#t-ajustes").onclick = async (e) => {
  const p = e.target.closest("[data-precio]"), a = e.target.closest("[data-ajuste]");
  try {
    if (p) { await api({ accion: "precio", id: p.dataset.precio, precio: $("#p-" + p.dataset.precio).value }); toast("Precio guardado"); }
    else if (a) { await api({ accion: "ajuste", clave: a.dataset.ajuste, valor: $("#a-" + a.dataset.ajuste).value }); toast("Dato guardado"); }
    else return;
    await cargar();
  } catch (err) { toast(err.message); }
};

if (PASS) cargar().catch(() => salir());
</script>
</body>
</html>
